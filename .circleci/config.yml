version: 2.1
jobs:
  build_website:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build site
          command: npm run build
      - run:
          name: Patch asset paths for artifact viewer
          # Astro emits processed assets at absolute /_astro/ paths. Prefix
          # them so the CircleCI artifact viewer can resolve them.
          command: |
            sh scripts/circleci-preview.sh \
              "/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/${CIRCLE_NODE_INDEX}/html"
      - store_artifacts:
          path: html
          destination: html
      - run:
          name: "Preview URL"
          command: echo "https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/${CIRCLE_NODE_INDEX}/html/index.html"

workflows:
  preview_website:
    jobs:
      - build_website
